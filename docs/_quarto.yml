project:
  type: book

book:
  title: "PDE: population dynamics of deep learning"
  chapters:
    - index.qmd
    - notation.qmd
    - part: "I. Population dynamics of deep networks"
      chapters:
        - 01-training-geometry.qmd
        - 02-gaussian-reuse.qmd
        - 03-local-population.qmd
        - 04-continuing-flows.qmd
        - 05-continuation-boundaries.qmd
        - 06-architectures.qmd
    - part: "II. Observable closure and approximation theory"
      chapters:
        - 07-observable-closure.qmd
        - 08-autonomous-computation.qmd
    - part: "III. Nonlinear learning and inductive bias"
      chapters:
        - 09-trainability.qmd
        - 10-correlated-pairs.qmd
        - 11-shape-and-depth.qmd
        - 12-three-sample-learning.qmd
        - 13-predictor-selection.qmd
        - 14-generalization.qmd
    - outlook.qmd

bibliography: references.bib

number-sections: false
crossref:
  chapters: false

classoption: enabledeprecatedfontcommands
header-includes:
  - \usepackage{mathtools}
  - \usepackage{fvextra}
  - \RecustomVerbatimEnvironment{verbatim}{Verbatim}{breaklines=true,breakanywhere=true}
  - \AtBeginDocument{\counterwithout{equation}{chapter}\counterwithout{theorem}{section}\counterwithout{lemma}{section}\counterwithout{proposition}{section}\counterwithout{corollary}{section}}
format:
  html: default
  pdf:
    pdf-engine: xelatex
    keep-tex: true
    latex-auto-install: false
    latex-tinytex: false
    filters:
      - pdf_breakable_tables.lua
  latex:
    filters:
      - pdf_breakable_tables.lua
