<div id="stieltjes-reconstruction-audit">
  <h2>Conditional Stieltjes reconstructions and calibration gap</h2>
  <div class="viz-row legend" aria-label="Series legend"></div>
  <div class="plots">
    <section><h3>Local transform audit</h3><div class="plot" data-panel="r"></div></section>
    <section><h3>Reconstructed feature gain</h3><div class="plot" data-panel="k"></div></section>
    <section><h3>Feature-ascent curve</h3><div class="plot" data-panel="f"></div></section>
    <section><h3>Squared-loss gradient flow</h3><div class="plot" data-panel="loss"></div></section>
  </div>
  <div class="tooltip" role="tooltip" hidden></div>
</div>

<style>
#stieltjes-reconstruction-audit { width: 100%; color: var(--foreground); position: relative; }
#stieltjes-reconstruction-audit h2 { margin: 0 0 10px; font-weight: 500; }
#stieltjes-reconstruction-audit h3 { margin: 8px 0 2px; font-weight: 500; }
#stieltjes-reconstruction-audit .plots { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 18px; }
#stieltjes-reconstruction-audit section { min-width: 0; }
#stieltjes-reconstruction-audit .plot { width: 100%; min-height: 270px; }
#stieltjes-reconstruction-audit .legend { gap: 14px; align-items: center; }
#stieltjes-reconstruction-audit .legend button { background: transparent; border: 0; color: var(--foreground); padding: 2px 0; display: inline-flex; gap: 6px; align-items: center; }
#stieltjes-reconstruction-audit .legend button[aria-pressed="false"] { color: var(--muted-foreground); }
#stieltjes-reconstruction-audit .swatch { width: 18px; height: 3px; display: inline-block; }
#stieltjes-reconstruction-audit svg { display: block; width: 100%; overflow: visible; }
#stieltjes-reconstruction-audit .frame { fill: transparent; stroke: var(--border); }
#stieltjes-reconstruction-audit .grid line { stroke: var(--border); stroke-opacity: .45; }
#stieltjes-reconstruction-audit .grid path { display: none; }
#stieltjes-reconstruction-audit .axis path,
#stieltjes-reconstruction-audit .axis line { stroke: var(--border); }
#stieltjes-reconstruction-audit .axis text,
#stieltjes-reconstruction-audit .axis-title,
#stieltjes-reconstruction-audit .annotation { fill: var(--foreground); font-size: 12px; }
#stieltjes-reconstruction-audit .line { fill: none; stroke-width: 2; }
#stieltjes-reconstruction-audit .point { stroke-width: 1.5; }
#stieltjes-reconstruction-audit .hover-guide { stroke: var(--muted-foreground); stroke-width: 1; pointer-events: none; }
#stieltjes-reconstruction-audit .hover-marker { stroke: var(--background); stroke-width: 1.5; pointer-events: none; }
#stieltjes-reconstruction-audit .tooltip { position: absolute; z-index: 20; pointer-events: none; background: var(--popover); color: var(--popover-foreground); border: 1px solid var(--border); padding: 6px 8px; }
@media (max-width: 620px) { #stieltjes-reconstruction-audit .plots { grid-template-columns: 1fr; } }
</style>

<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script>
(() => {
  const root = document.getElementById('stieltjes-reconstruction-audit');
  const colors = ['var(--viz-series-1)','var(--viz-series-2)','var(--viz-series-3)','var(--viz-series-4)','var(--viz-series-5)'];
  const mu = [68.38665692719747, 6.844249882233634, 2.9351336011045515, 1.597034988943324, 0.9797782743767937];
  const atoms2 = [{l:0.027262999847852114,w:58.89534501443515},{l:0.5519348798369933,w:9.491311912762315}];
  const atoms3 = [{l:0,w:46.810940920480075},{l:0.21339334409439942,w:16.540318166496295},{l:0.6582709413391857,w:5.035397840221098}];
  const atoms1 = [{l:mu[1]/mu[0],w:mu[0]}];
  const proxy = [
    {x:0.0016,y:68.37458184},{x:0.0064,y:68.33848017},
    {x:0.0144,y:68.27871905},{x:0.0256,y:68.19589861}
  ];
  const visible = new Map([['one',true],['two',true],['three',true],['taylor',true],['proxy',true]]);
  const labels = new Map([
    ['one','1-atom conditional lower'],['two','2-atom conditional lower'],
    ['three','3-atom conditional upper'],
    ['taylor','Exact local quartic jet'],['proxy','Width-256 stopped median proxy']
  ]);
  const color = new Map([['one',colors[1]],['two',colors[0]],['three',colors[4]],['taylor',colors[2]],['proxy',colors[3]]]);

  function R(x, atoms) { return atoms.reduce((z,a) => z + a.w/(1+a.l*x), 0); }
  function RTaylor(x) { return mu[0]-mu[1]*x+mu[2]*x*x-mu[3]*x*x*x+mu[4]*x*x*x*x; }
  function K(y, atoms) { return 111 + y*y*R(y*y, atoms); }
  function rk4(fun, t0, y0, t1, steps) {
    const out=[{x:t0,y:y0}]; let t=t0,y=y0,h=(t1-t0)/steps;
    for(let i=0;i<steps;i++){
      const k1=fun(t,y), k2=fun(t+h/2,y+h*k1/2), k3=fun(t+h/2,y+h*k2/2), k4=fun(t+h,y+h*k3);
      y += h*(k1+2*k2+2*k3+k4)/6; t += h; out.push({x:t,y});
    }
    return out;
  }
  const dense=(lo,hi,n,fn)=>d3.range(n+1).map(i=>{const x=lo+(hi-lo)*i/n;return{x,y:fn(x)}});
  const rSeries=[
    {id:'one',data:dense(0,.03,180,x=>R(x,atoms1))},
    {id:'two',data:dense(0,.03,180,x=>R(x,atoms2))},
    {id:'three',data:dense(0,.03,180,x=>R(x,atoms3))},
    {id:'taylor',data:dense(0,.03,180,RTaylor)},
    {id:'proxy',data:proxy,points:true}
  ];
  const kSeries=[
    {id:'one',data:dense(0,2,200,y=>K(y,atoms1))},
    {id:'two',data:dense(0,2,200,y=>K(y,atoms2))},
    {id:'three',data:dense(0,2,200,y=>K(y,atoms3))}
  ];
  const fSeries=[
    {id:'one',data:rk4((s,y)=>K(y,atoms1),0,0,.012,240)},
    {id:'two',data:rk4((s,y)=>K(y,atoms2),0,0,.012,240)},
    {id:'three',data:rk4((s,y)=>K(y,atoms3),0,0,.012,240)}
  ];
  const lossSeries=[
    {id:'one',data:rk4((t,y)=>2*(1-y)*K(y,atoms1),0,0,.025,250).map(d=>({x:d.x,y:(1-d.y)**2}))},
    {id:'two',data:rk4((t,y)=>2*(1-y)*K(y,atoms2),0,0,.025,250).map(d=>({x:d.x,y:(1-d.y)**2}))},
    {id:'three',data:rk4((t,y)=>2*(1-y)*K(y,atoms3),0,0,.025,250).map(d=>({x:d.x,y:(1-d.y)**2}))}
  ];
  const panels={
    r:{series:rSeries,xLabel:'x = y²',yLabel:'R(x)'},
    k:{series:kSeries,xLabel:'output y',yLabel:'K(y)'},
    f:{series:fSeries,xLabel:'feature time s',yLabel:'F(s)'},
    loss:{series:lossSeries,xLabel:'gradient-flow time τ (η absorbed)',yLabel:'loss (1 − y)²'}
  };

  const legend=root.querySelector('.legend');
  ['one','two','three','taylor','proxy'].forEach(id=>{
    const b=document.createElement('button'); b.type='button'; b.setAttribute('aria-pressed','true'); b.dataset.id=id;
    b.innerHTML=`<span class="swatch" style="background:${color.get(id)}"></span><span>${labels.get(id)}</span>`;
    b.addEventListener('click',()=>{visible.set(id,!visible.get(id));b.setAttribute('aria-pressed',String(visible.get(id)));drawAll();});
    legend.appendChild(b);
  });

  function draw(container,spec){
    container.replaceChildren();
    const width=Math.max(320,container.getBoundingClientRect().width||480), height=270;
    const margin={top:10,right:20,bottom:48,left:68};
    const active=spec.series.filter(s=>visible.get(s.id));
    if (!active.length) {
      const empty=document.createElement('div'); empty.className='text-muted';
      empty.textContent='Select at least one applicable series.'; container.appendChild(empty); return;
    }
    const all=active.flatMap(s=>s.data);
    const xd=d3.extent(all,d=>d.x), yd=d3.extent(all,d=>d.y);
    const xp=(xd[1]-xd[0]||1)*.035, yp=(yd[1]-yd[0]||1)*.08;
    const x=d3.scaleLinear().domain([xd[0]-xp,xd[1]+xp]).range([margin.left,width-margin.right]);
    const y=d3.scaleLinear().domain([Math.min(0,yd[0]-yp),yd[1]+yp]).nice().range([height-margin.bottom,margin.top]);
    const svg=d3.select(container).append('svg').attr('viewBox',`0 0 ${width} ${height}`).attr('role','img').attr('aria-label',`${spec.yLabel} against ${spec.xLabel}`);
    svg.append('rect').attr('class','frame').attr('data-chart-frame','').attr('x',margin.left).attr('y',margin.top).attr('width',width-margin.left-margin.right).attr('height',height-margin.top-margin.bottom);
    svg.append('g').attr('class','grid').attr('transform',`translate(${margin.left},0)`).call(d3.axisLeft(y).ticks(5).tickSize(-(width-margin.left-margin.right)).tickFormat(''));
    svg.append('g').attr('class','axis').attr('transform',`translate(0,${height-margin.bottom})`).call(d3.axisBottom(x).ticks(width<420?4:6).tickFormat(d3.format('.3~g')));
    svg.append('g').attr('class','axis').attr('transform',`translate(${margin.left},0)`).call(d3.axisLeft(y).ticks(5).tickFormat(d3.format('.5~g')));
    svg.append('text').attr('class','axis-title').attr('data-axis','x').attr('x',(margin.left+width-margin.right)/2).attr('y',height-8).attr('text-anchor','middle').text(spec.xLabel);
    svg.append('text').attr('class','axis-title').attr('data-axis','y').attr('transform','rotate(-90)').attr('x',-(margin.top+height-margin.bottom)/2).attr('y',16).attr('text-anchor','middle').text(spec.yLabel);
    const line=d3.line().x(d=>x(d.x)).y(d=>y(d.y));
    active.forEach(s=>{
      if(!s.points) svg.append('path').datum(s.data).attr('class','line').attr('data-series',s.id).attr('stroke',color.get(s.id)).attr('d',line);
      else svg.selectAll(`circle.${s.id}`).data(s.data).join('circle').attr('class',`point ${s.id}`).attr('data-series',s.id).attr('cx',d=>x(d.x)).attr('cy',d=>y(d.y)).attr('r',4.5).attr('fill',color.get(s.id)).attr('stroke','var(--background)');
    });
    const guide=svg.append('line').attr('class','hover-guide').attr('data-chart-hover-guide','').attr('y1',margin.top).attr('y2',height-margin.bottom).style('display','none');
    const markers=svg.append('g');
    const overlay=svg.append('rect').attr('data-chart-hit','').attr('data-chart-hover-overlay','cross-series').attr('x',margin.left).attr('y',margin.top).attr('width',width-margin.left-margin.right).attr('height',height-margin.top-margin.bottom).attr('fill','transparent').style('pointer-events','all');
    const tip=root.querySelector('.tooltip');
    overlay.on('pointermove',(event)=>{
      const [px]=d3.pointer(event,svg.node()), xv=x.invert(px); guide.attr('x1',px).attr('x2',px).style('display',null); markers.selectAll('*').remove();
      const rows=[];
      active.forEach(s=>{const bis=d3.bisector(d=>d.x).center;const i=bis(s.data,xv);const d=s.data[Math.max(0,Math.min(s.data.length-1,i))];
        markers.append('circle').attr('class','hover-marker').attr('data-chart-hover-marker','').attr('cx',x(d.x)).attr('cy',y(d.y)).attr('r',4).attr('fill',color.get(s.id)); rows.push(`${labels.get(s.id)}: ${d.y.toPrecision(7)}`);});
      tip.hidden=false;tip.innerHTML=`${spec.xLabel}: ${xv.toPrecision(5)}<br>${rows.join('<br>')}`;tip.style.left=`${event.offsetX+12}px`;tip.style.top=`${event.offsetY+12}px`;
    }).on('pointerleave',()=>{guide.style('display','none');markers.selectAll('*').remove();tip.hidden=true;});
  }
  function drawAll(){Object.entries(panels).forEach(([id,spec])=>draw(root.querySelector(`[data-panel="${id}"]`),spec));}
  drawAll();
  new ResizeObserver(()=>drawAll()).observe(root);
})();
</script>
